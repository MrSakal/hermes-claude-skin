name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check plugin syntax
        run: node --check src/plugin.js && node --check claude-chat-look/plugin.js

      - name: Check the build is the source's
        run: node scripts/build-updater.mjs && git diff --exit-code claude-chat-look CHECKSUMS.sha256

      - name: Verify published checksum
        run: sha256sum -c CHECKSUMS.sha256
